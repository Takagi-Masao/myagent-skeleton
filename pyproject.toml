[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.1.0"
description = "A minimal, hackable coding agent for the AI lab course"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
myagent = "myagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myagent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "bronze: required for the in-class walking skeleton",
    "silver: post-class session/resume",
    "gold: optional compaction and extensions",
]
